<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Devocionalion</title>
<style>
:root{--bg:#12123a;--card:#1e1e52;--line:#34347a;--ink:#f6efe0;--mute:#a9a9d6;--gold:#ffb52e;--gold-d:#c27a00;--acc:#ffb52e;--on:#3a2300;--ok:#4fd1a5;--okbg:#12423a;--bad:#ff6b6b;--badbg:#4a1f2e;--sel:#2d2d6e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff7e6;--card:#fff;--line:#ecdcb8;--ink:#2a2140;--mute:#6b6385;--gold-d:#d98a00;--acc:#a85f00;--ok:#1f8f6a;--okbg:#dcf5ec;--bad:#c93a45;--badbg:#fde4e6;--sel:#fff0cf;color-scheme:light}}
:root[data-theme="light"]{--bg:#fff7e6;--card:#fff;--line:#ecdcb8;--ink:#2a2140;--mute:#6b6385;--gold-d:#d98a00;--acc:#a85f00;--ok:#1f8f6a;--okbg:#dcf5ec;--bad:#c93a45;--badbg:#fde4e6;--sel:#fff0cf;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Trebuchet MS",system-ui,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:14px 18px 30px}
h1,h2,.verse{font-family:Georgia,"Times New Roman",serif}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}.top .pill:nth-child(2){margin-right:auto}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px}
.x{background:none;border:0;color:var(--mute);font-size:24px;cursor:pointer;line-height:1;padding:4px}
.hero{display:flex;align-items:flex-end;gap:12px;margin:4px 0 18px}
.lion{width:112px;height:auto;image-rendering:pixelated;flex:none}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;font-family:Georgia,serif}
h1{font-size:30px;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 16px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--gold);color:var(--on);font:inherit;font-weight:800;padding:14px;box-shadow:0 4px 0 var(--gold-d);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn[disabled]{background:var(--line);color:var(--mute);box-shadow:none;cursor:not-allowed}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.stop:focus-visible,nav button:focus-visible,.x:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.dot{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--on);display:grid;place-items:center;font-weight:800;box-shadow:0 4px 0 var(--gold-d);flex:none}
.done .dot{background:var(--ok);color:#fff;box-shadow:0 4px 0 #23906e}
.path{display:flex;flex-direction:column;align-items:center;padding:6px 0}
.stop{display:flex;flex-direction:column;align-items:center;gap:6px;width:160px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:center;padding:0}
.stop[disabled]{opacity:.5;cursor:not-allowed}
.stop .dot{width:68px;height:68px;font-size:24px}
.stop.cur .dot{box-shadow:0 5px 0 var(--gold-d),0 0 0 7px color-mix(in srgb,var(--gold) 30%,transparent)}
.stop b{font-size:15px;line-height:1.25}
.stop:not(:last-child)::after{content:"";height:22px;border-left:3px dotted var(--line);margin:2px 0 6px}
.gcard{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 18px;margin-top:6px}
.gcard .lion{width:130px}.gcard p{color:var(--mute);margin:6px 0 14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:8px 0;cursor:pointer;display:grid;justify-items:center}
nav button.on{color:var(--acc)}nav span{font-size:22px}
.bar{height:12px;background:var(--card);border:2px solid var(--line);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
h2{font-size:22px;margin:22px 0 14px;line-height:1.3}
.verse{font-size:21px;line-height:1.6}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--acc);text-align:center;color:var(--acc)}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.opt.sel{border-color:var(--acc);background:var(--sel)}
.opt.ok{border-color:var(--ok);background:var(--okbg);opacity:.75}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt>div{display:grid;gap:8px;align-content:start}.mt .opt{font-size:15px;padding:10px}
.slots{min-height:84px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 11px;color:inherit;font:inherit;cursor:pointer}
.chip.used{opacity:.25;pointer-events:none}
.fb{margin-top:18px;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb img{width:54px;image-rendering:pixelated}
.big{text-align:center}.big .lion{width:170px}
.stats{display:flex;gap:12px;justify-content:center;margin:16px 0}
canvas{width:100%;max-width:320px;display:block;margin:0 auto 10px;border-radius:16px;touch-action:none}
@media (prefers-reduced-motion:no-preference){.hero .lion{animation:b 2.4s ease-in-out infinite}@keyframes b{50%{transform:translateY(-4px)}}}
</style>
</head>

<main id="app"></main>

while(pl.length<9)pl.push({x:Math.random()*256,y:Math.min(...pl.map(q=>q.y))-(55+Math.min(sc/60,25))})}
const m=Math.floor(sc/10);
c.fillStyle=`hsl(232,55%,${14+Math.min(sc/3000,1)*58}%)`;c.fillRect(0,0,320,480);
c.fillStyle="#f6efe0";pl.forEach(q=>{c.beginPath();c.ellipse(q.x+32,q.y+5,32,7,0,0,7);c.fill()});
if(im.complete)c.drawImage(im,p.x,p.y-45,34,45);
document.getElementById("sc").textContent=m+" m"+(m>=300?" ☁ Céu!":"");
if(p.y>500){stop();const rec=m>S.best;if(rec)S.best=m;save();
$.innerHTML=`<div class="big"><img class="lion" src="${LION}" alt="Eli, o leão"><h1>${m} m</h1><p class="sub">${rec?"Novo recorde!":"Recorde: "+S.best+" m"}</p><button class="btn" id="a">Jogar de novo</button><button class="btn alt" id="b" style="margin-top:10px">Voltar</button></div>`;
$.querySelector("#a").onclick=game;$.querySelector("#b").onclick=home;return}
requestAnimationFrame(loop)})()}
home();
</script>
